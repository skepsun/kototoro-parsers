<!doctype html><html><head><meta charset="utf-8"><title>正文</title></head><body><div class="content"><p>“发生什么事了！”</p><p> 突来变故，震惊众人，一道苍老的声音自修真院传出。</p><p> 前有无常元帅视四宗为无物，把四宗的颜面按在地上磨擦，后有修真院莫名动乱，让他们这些四宗老人很难做啊。</p><p> “如此邪气，是宗内那口血不染！”</p></div><div class="tui"><div class="listtop"><a href="/shu_46209.html">别的书</a></div></div></body></html>
