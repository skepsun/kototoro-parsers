name: Build and Release Plugin

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 8 & 17
        uses: actions/setup-java@v4
        with:
          # 17 运行 Gradle，8 是 build.gradle.kts 里 jvmToolchain(8) 需要的编译 JDK；
          # 新版 runner 镜像（ubuntu-26.04）不再预装 JDK 8，必须显式安装
          java-version: |
            8
            17
          distribution: 'temurin'

      - name: Build standard JAR
        run: ./gradlew jar --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64:?JDK 8 toolchain is missing}"
        
      - name: D8 Dexing and Packaging
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          D8_PATH="$BUILD_TOOLS_DIR/d8"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          
          cd build/libs
          JAR_FILE=$(ls *.jar | head -n 1)
          $D8_PATH --release --lib $ANDROID_JAR --output . $JAR_FILE
          
          jar cvf plugin.jar classes.dex
          
          # Setup deploy directory
          mkdir -p ../../deploy/apk
          cp plugin.jar ../../deploy/apk/

          # Create index.min.json for the repository
          # Format follows Mihon extension repo structure loosely
          cat << EOF > ../../deploy/index.min.json
          [
            {
              "name": "Kototoro Parsers",
              "pkg": "org.skepsun.kototoro.parsers",
              "version": "1.0.${{ github.run_number }}",
              "code": ${{ github.run_number }},
              "apk": "plugin.jar",
              "lang": "all",
              "nsfw": 0
            }
          ]
          EOF

      - name: Deploy to Repo Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: repo
          force_orphan: true
